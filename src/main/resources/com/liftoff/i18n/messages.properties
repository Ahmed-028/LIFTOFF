# Nova's tutorial (first mission only)
guide.name=Nova
guide.next=Next ▶
guide.gotIt=Got it ✓
guide.skip=Skip tutorial
guide.hello=Hi, I'm Nova! I'll be your guide on this first mission. Let's plan a real space mission together!
guide.map=This is your road map. Five levels take you from Earth to space, and two of them are fun bonus games.
guide.play=Your rocket is at level 1. Press Play to start!
guide.travel=Nice work! Your rocket flew to the next level. Press Play when you are ready.
guide.briefing=This is your mission. Farmers need pictures from space that are sharp enough to see each field.
guide.briefingNext=Read the goals, then press the orange button to plan your flight.
guide.tabs=Your ship has five parts. Each tab on the left is one part: body, thrusters, power, cargo bay and payload.
guide.parts=Click a card to fit that part to your ship. Try them! You can swap a part any time.
guide.ship3d=Watch your ship change in the 3D hangar. Drag it to turn it around.
guide.gauges=These gauges show weight, money and power. If one says Over limit, press it and I'll suggest a fix.
guide.shipDone=All five parts are fitted! Press Continue to supplies.
guide.match=Game time! Swap two tiles side by side to line up three of a kind.
guide.matchSkip=It's just for fun and it doesn't change your ship. You can skip it if you like.
guide.rocket=Every ship needs a rocket to get to space. Pick one here, and an orbit below it.
guide.tools=Science tools do the discovering. They are grouped by the job they do. Pick one marked Must-do goal.
guide.readings=Keep an eye on these readings. A ✓ means that part of your mission is fine.
guide.toReview=When everything looks good, press Review mission.
guide.review=This is your final check. If everything is OK, confirm your build!
guide.dash=Steer with the arrow keys or the buttons. Jump the rocks, duck under beams and dodge the boulders!
guide.launch=Launch day! Run the checks. If something fails, the card will say what to change.
guide.fly=Your mission is flying! Watch what happens, or peek inside the cockpit.
guide.report=Here's how your mission went: what worked, what broke first and what to try next.
guide.goodbye=Great job, mission designer! The next missions are harder. You're ready to try them on your own!

